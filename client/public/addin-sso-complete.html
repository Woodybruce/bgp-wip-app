<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in…</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
    .spinner { width: 22px; height: 22px; border: 2px solid rgba(0,0,0,0.15); border-top-color: #111; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 13px; color: #374151; }
    .err { font-size: 12px; color: #b91c1c; max-width: 280px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spin"></div>
    <div class="msg" id="msg">Completing sign-in…</div>
    <div class="err" id="err"></div>
  </div>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script>
    (function () {
      function qp(name) { try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; } }
      function show(text, isError) {
        var m = document.getElementById("msg"), e = document.getElementById("err"), s = document.getElementById("spin");
        if (isError) { if (s) s.style.display = "none"; if (m) m.textContent = "Sign-in didn't complete"; if (e) e.textContent = text || ""; }
        else if (m) { m.textContent = text; }
      }
      function send(payload) {
        try { Office.context.ui.messageParent(JSON.stringify(payload)); }
        catch (e) { show("Couldn't return to the add-in. Close this window and try again.", true); }
      }
      function run() {
        var code = qp("sso_code");
        var err = qp("sso_error");
        if (code) { show("Signing you in…"); send({ sso_code: code }); }
        else { show(err || "Sign-in failed. Please try again.", true); send({ error: err || "Sign-in failed" }); }
      }
      if (window.Office && Office.onReady) { Office.onReady(function () { run(); }); }
      else { window.addEventListener("load", run); }
    })();
  </script>
</body>
</html>
