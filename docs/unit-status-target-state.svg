<?xml version="1.0" encoding="UTF-8"?>
<svg width="1700" height="1420" viewBox="0 0 1700 1420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#15803D"/>
    </marker>
    <marker id="b" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="bS" markerWidth="12" markerHeight="12" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L0,4 L9,8 Z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect width="1700" height="1420" fill="#FAF9F7"/>

  <text x="60" y="54" font-size="30" font-weight="700" fill="#1F2937">BGP — Unit Status Architecture <tspan fill="#15803D">(target state)</tspan></text>
  <text x="60" y="85" font-size="15" fill="#6B7280">One deal vocabulary across all four boards · occupancy and marketing live on separate axes · a unit can be Trading AND on the market at the same time.</text>

  <!-- ============ TWO-AXIS BANNER ============ -->
  <g>
    <rect x="60" y="115" width="1580" height="190" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="86" y="148" font-size="16" font-weight="700" fill="#1F2937">The model — two axes, never collapsed</text>

    <!-- axis 1 -->
    <rect x="86" y="166" width="745" height="120" rx="10" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="104" y="194" font-size="13" font-weight="700" fill="#166534">AXIS 1 — DEAL JOURNEY (shared by all 4 boards)</text>
    <g font-size="13.5" fill="#065F46">
      <text x="104" y="222" font-weight="700">Available</text>
      <text x="190" y="222">▸</text>
      <text x="208" y="222" font-weight="700">Negotiating</text>
      <text x="312" y="222">▸</text>
      <text x="330" y="222" font-weight="700">Solicitors</text>
      <text x="416" y="222">▸</text>
      <text x="434" y="222" font-weight="700">Exchanged</text>
      <text x="540" y="222">▸</text>
      <text x="558" y="222" font-weight="700">Completed</text>
      <text x="660" y="222">▸</text>
      <text x="678" y="222" font-weight="700">Invoiced</text>
    </g>
    <text x="104" y="248" font-size="12" fill="#15803D">…or → Withdrawn</text>
    <text x="104" y="272" font-size="11.5" fill="#6B7280">stored on <tspan font-family="monospace" fill="#374151">crm_deals.status</tspan>  ·  same names everywhere  ·  WIP filter ≥ Negotiating  ·  Deals board filter ≥ Solicitors</text>

    <!-- axis 2 -->
    <rect x="855" y="166" width="785" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="875" y="194" font-size="13" font-weight="700" fill="#1E3A8A">AXIS 2 — UNIT STATE (orthogonal · lives on Tenancy)</text>
    <g font-size="13" fill="#1E3A8A">
      <text x="875" y="220"><tspan font-weight="700">occupancy</tspan>  =  Vacant · Trading · Holding Over · Lease Event Pending · Archived</text>
      <text x="875" y="246"><tspan font-weight="700">marketing_active</tspan>  =  true / false      <tspan font-weight="700">marketing_reason</tspan>  =  Vacant · Lease Event · Tenant at Risk · Active Mgmt</text>
    </g>
    <text x="875" y="276" font-size="11.5" fill="#6B7280">a Trading unit being remarketed = occupancy: Trading + marketing_active: true + a new deal (Available)</text>
  </g>

  <!-- ============ BOARDS ROW ============ -->
  <!-- Tenancy spine, full width -->
  <g>
    <rect x="60" y="330" width="1580" height="170" rx="12" fill="#1F2937"/>
    <text x="82" y="368" font-size="19" font-weight="700" fill="#FFFFFF">TENANCY — rent roll <tspan font-size="14" fill="#9CA3AF" font-weight="400">canonical · source of truth · holds occupancy + marketing flag</tspan></text>
    <text x="82" y="400" font-size="13" fill="#9CA3AF">table</text>
    <text x="170" y="400" font-size="13" font-weight="600" fill="#FFFFFF" font-family="monospace">tenancy_schedule_units</text>
    <text x="82" y="428" font-size="13" fill="#9CA3AF">columns</text>
    <text x="170" y="428" font-size="13" font-weight="600" fill="#FBBF24" font-family="monospace">occupancy · marketing_active · marketing_reason</text>
    <text x="82" y="456" font-size="13" fill="#9CA3AF">deal link</text>
    <text x="170" y="456" font-size="13" font-weight="600" fill="#FFFFFF" font-family="monospace">crm_deals.tenancy_unit_id  →</text>
    <text x="450" y="456" font-size="13" fill="#86EFAC">a unit can carry 0..N deals (current tenancy + any live letting)</text>
    <text x="82" y="486" font-size="12.5" fill="#FCA5A5">No status column. No reverse-mirror coarsening. Trading + Lease Event Pending + a live Available deal coexist.</text>
  </g>

  <!-- arrows from tenancy up to 3 lens boards -->
  <line x1="280" y1="330" x2="280" y2="250" stroke="#15803D" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="850" y1="330" x2="850" y2="250" stroke="#15803D" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="1420" y1="330" x2="1420" y2="250" stroke="#15803D" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Three lens boards -->
  <g>
    <rect x="60" y="540" width="500" height="240" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="60" y="540" width="500" height="40" rx="12" fill="#7C3AED"/>
    <rect x="60" y="562" width="500" height="18" fill="#7C3AED"/>
    <text x="82" y="567" font-size="16" font-weight="700" fill="#FFFFFF">LETTING TRACKER</text>
    <text x="478" y="567" font-size="12" fill="#E9D5FF">per-agent · mobile</text>
    <text x="82" y="608" font-size="13" fill="#6B7280">filter</text>
    <text x="170" y="608" font-size="13" font-weight="600" fill="#1F2937" font-family="monospace">marketing_active = true · agent = me</text>
    <text x="82" y="636" font-size="13" fill="#6B7280">shows</text>
    <text x="170" y="636" font-size="13" font-weight="600" fill="#7C3AED">deal status pill (the 7)</text>
    <text x="82" y="664" font-size="13" fill="#6B7280">owns</text>
    <text x="170" y="664" font-size="13" fill="#1F2937">viewings · offers · files · agents</text>
    <text x="82" y="708" font-size="12" fill="#9CA3AF">Quick taps to bump status on the go.</text>
    <text x="82" y="726" font-size="12" fill="#9CA3AF">Add ➜ creates tenancy row + deal (Available).</text>
    <text x="82" y="752" font-size="12" font-style="italic" fill="#6B7280">"all my marketed units, anywhere"</text>
  </g>

  <g>
    <rect x="600" y="540" width="500" height="240" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="600" y="540" width="500" height="40" rx="12" fill="#B45309"/>
    <rect x="600" y="562" width="500" height="18" fill="#B45309"/>
    <text x="622" y="567" font-size="16" font-weight="700" fill="#FFFFFF">LEASING SCHEDULE</text>
    <text x="1018" y="567" font-size="12" fill="#FDE68A">per-property · client</text>
    <text x="622" y="608" font-size="13" fill="#6B7280">filter</text>
    <text x="710" y="608" font-size="13" font-weight="600" fill="#1F2937" font-family="monospace">marketing_active = true · property = X</text>
    <text x="622" y="636" font-size="13" fill="#6B7280">shows</text>
    <text x="710" y="636" font-size="13" font-weight="600" fill="#B45309">deal status pill (the 7) · marketing reason</text>
    <text x="622" y="664" font-size="13" fill="#6B7280">output</text>
    <text x="710" y="664" font-size="13" fill="#1F2937">bespoke client Excel · client property page</text>
    <text x="622" y="708" font-size="12" fill="#9CA3AF">Same row data as the tracker — different scope.</text>
    <text x="622" y="752" font-size="12" font-style="italic" fill="#6B7280">"this property’s marketed units, for the client"</text>
  </g>

  <g>
    <rect x="1140" y="540" width="500" height="240" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="1140" y="540" width="500" height="40" rx="12" fill="#0F766E"/>
    <rect x="1140" y="562" width="500" height="18" fill="#0F766E"/>
    <text x="1162" y="567" font-size="16" font-weight="700" fill="#FFFFFF">DEALS BOARD</text>
    <text x="1558" y="567" font-size="12" fill="#CCFBF1">company-wide</text>
    <text x="1162" y="608" font-size="13" fill="#6B7280">filter</text>
    <text x="1250" y="608" font-size="13" font-weight="600" fill="#1F2937" font-family="monospace">deal status ≥ Solicitors</text>
    <text x="1162" y="636" font-size="13" fill="#6B7280">shows</text>
    <text x="1250" y="636" font-size="13" font-weight="600" fill="#0F766E">deal status pill (the 7)</text>
    <text x="1162" y="664" font-size="13" fill="#6B7280">linked WIP</text>
    <text x="1250" y="664" font-size="13" fill="#1F2937">≥ Negotiating ➜ fee/commission tracking</text>
    <text x="1162" y="708" font-size="12" fill="#9CA3AF">Sole owner of deal status. Edits propagate.</text>
    <text x="1162" y="752" font-size="12" font-style="italic" fill="#6B7280">"all deals in flight, firm-wide"</text>
  </g>

  <!-- key insight banner above lens boards -->
  <text x="850" y="528" font-size="13" font-weight="600" fill="#15803D" text-anchor="middle">— views into the same data, filtered by who's looking —</text>

  <!-- ============ ENGINE BOX (single engine) ============ -->
  <g>
    <rect x="60" y="810" width="1090" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="82" y="844" font-size="17" font-weight="700" fill="#1F2937">One engine, not two</text>
    <text x="82" y="866" font-size="12.5" fill="#6B7280">unit-mirror.ts + lease-status-mirror.ts collapse into a single module with one shared mapping table.</text>

    <!-- Deal status edit propagation -->
    <circle cx="100" cy="900" r="6" fill="#1D4ED8"/>
    <text x="118" y="905" font-size="14" font-weight="700" fill="#1D4ED8">Deal status edit (from any board) ➜</text>
    <text x="118" y="928" font-size="13" fill="#374151">writes <tspan font-family="monospace" font-weight="700">crm_deals.status</tspan>. All three lens boards re-read; pill updates everywhere.</text>
    <text x="118" y="948" font-size="13" fill="#374151">When status becomes <tspan font-weight="700">Completed</tspan>: tenancy occupancy flips to <tspan font-weight="700">Trading</tspan>; marketing_active cleared if reason was Vacant.</text>

    <!-- Marketing flag edit -->
    <circle cx="100" cy="982" r="6" fill="#15803D"/>
    <text x="118" y="987" font-size="14" font-weight="700" fill="#15803D">Marketing on/off + reason (from any board) ➜</text>
    <text x="118" y="1010" font-size="13" fill="#374151">writes <tspan font-family="monospace" font-weight="700">tenancy_schedule_units.marketing_active</tspan>. Unit appears/disappears on Tracker + Leasing.</text>
    <text x="118" y="1030" font-size="13" fill="#374151">Switching marketing ON with no live deal ➜ creates a deal at <tspan font-weight="700">Available</tspan> automatically.</text>

    <!-- Occupancy edit -->
    <circle cx="100" cy="1062" r="6" fill="#9333EA"/>
    <text x="118" y="1067" font-size="14" font-weight="700" fill="#9333EA">Occupancy edit (Tenancy only) ➜</text>
    <text x="118" y="1085" font-size="13" fill="#374151">no fan-out. It’s the rent roll truth; the boards don’t need to know.</text>
  </g>

  <!-- ============ WHAT CLEANUP THIS FIXES ============ -->
  <g>
    <rect x="1180" y="810" width="460" height="280" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <text x="1202" y="844" font-size="16" font-weight="700" fill="#166534">✔ Fixes all 5 cleanup candidates</text>
    <g font-size="13" fill="#14532D">
      <text x="1202" y="876" font-weight="700">1.</text><text x="1224" y="876">Tenancy “Add” + marketing on ➜ deal opens.</text>
      <text x="1202" y="906" font-weight="700">2.</text><text x="1224" y="906">Deals are deals; units stay on the rent roll</text>
      <text x="1224" y="924">whether or not one exists.</text>
      <text x="1202" y="952" font-weight="700">3.</text><text x="1224" y="952">No reverse-mirror coarsening — occupancy</text>
      <text x="1224" y="970">is on its own axis, untouchable from deals.</text>
      <text x="1202" y="998" font-weight="700">4.</text><text x="1224" y="998">One vocabulary ➜ no unrecognised-status</text>
      <text x="1224" y="1016">no-op.</text>
      <text x="1202" y="1044" font-weight="700">5.</text><text x="1224" y="1044">One mapping source. Two engines collapsed.</text>
      <text x="1224" y="1062">unit-mirror.ts retired.</text>
    </g>
  </g>

  <!-- ============ MIGRATION PLAN STRIP ============ -->
  <g>
    <rect x="60" y="1120" width="1580" height="280" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="82" y="1154" font-size="17" font-weight="700" fill="#1F2937">Migration plan — staged, reversible, no Bluewater downtime</text>

    <g font-size="13" fill="#374151">
      <text x="82" y="1186" font-weight="700" fill="#7C3AED">STAGE 1 — additive schema</text>
      <text x="82" y="1206">Add columns: <tspan font-family="monospace">occupancy · marketing_active · marketing_reason</tspan>. Keep <tspan font-family="monospace">status</tspan> in place. Backfill via mapping. Dual-write.</text>

      <text x="82" y="1240" font-weight="700" fill="#7C3AED">STAGE 2 — UI rename only</text>
      <text x="82" y="1260">Status pills and dropdowns adopt the 7 names firm-wide. Leasing Schedule’s own enum retired in the UI; reads still work.</text>

      <text x="82" y="1294" font-weight="700" fill="#7C3AED">STAGE 3 — engine collapse</text>
      <text x="82" y="1314">Replace unit-mirror.ts inline maps with the shared mapping. One module. Old reverse-mirror to <tspan font-family="monospace">status</tspan> still runs for safety.</text>

      <text x="82" y="1348" font-weight="700" fill="#7C3AED">STAGE 4 — flip &amp; delete</text>
      <text x="82" y="1368">Verify Bluewater consistency. Drop the old <tspan font-family="monospace">status</tspan> column on tenancy. Remove dual-write. Diagram becomes the new ground truth.</text>
    </g>
  </g>
</svg>
